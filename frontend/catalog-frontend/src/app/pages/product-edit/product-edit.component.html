<div class="edit-wrapper">

  <!-- Navbar -->
  <nav class="navbar" id="edit-navbar">
    <div class="nav-left">
      <button id="back-btn" class="btn-back" (click)="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Volver al catálogo
      </button>
    </div>
    <div class="nav-brand">
      <div class="nav-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
      </div>
      <span class="nav-title">Catálogo 2026</span>
    </div>
    <div class="nav-right">
      <button id="edit-logout-btn" class="btn-logout" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </div>
  </nav>

  <!-- Loading -->
  <div class="loading-state" *ngIf="loading">
    <div class="loading-spinner"></div>
    <p>Cargando producto...</p>
  </div>

  <!-- Error load -->
  <div class="error-load" *ngIf="!loading && error && !product" id="load-error-msg">
    <div class="error-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h3>{{ error }}</h3>
    <button class="btn-back-error" (click)="goBack()">Volver al catálogo</button>
  </div>

  <!-- Edit Form -->
  <main class="edit-main" *ngIf="!loading && product">
    <div class="edit-layout">

      <!-- Product preview panel -->
      <div class="preview-panel">
        <div class="preview-image-wrap">
          <img [src]="product.imagenUrl" [alt]="product.nombre" class="preview-image" />
        </div>
        <div class="preview-info">
          <span class="preview-category">{{ product.categoria }}</span>
          <p class="preview-name">{{ product.nombre }}</p>
          <div class="preview-meta">
            <span class="preview-external-id">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
              </svg>
              External ID: #{{ product.externalId }}
            </span>
          </div>
          <div class="preview-badge">Solo consulta</div>
        </div>
      </div>

      <!-- Form panel -->
      <div class="form-panel">
        <div class="form-header">
          <div class="edit-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </div>
          <div>
            <h1 id="edit-title">Editar Producto</h1>
            <p class="form-subtitle">Modifica los campos y guarda los cambios</p>
          </div>
        </div>

        <!-- Alerts -->
        <div class="alert alert-success" *ngIf="success" id="save-success-alert">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          {{ success }}
        </div>

        <div class="alert alert-error" *ngIf="error && product" id="save-error-alert">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ error }}
        </div>

        <!-- Form -->
        <form id="edit-form" (ngSubmit)="onSubmit()" #editForm="ngForm">

          <div class="form-group">
            <label for="nombre-input">
              Nombre <span class="required">*</span>
            </label>
            <input
              id="nombre-input"
              type="text"
              class="form-input"
              [(ngModel)]="nombre"
              name="nombre"
              placeholder="Nombre del producto"
              required
            />
          </div>

          <div class="form-group">
            <label for="descripcion-input">Descripción</label>
            <textarea
              id="descripcion-input"
              class="form-input form-textarea"
              [(ngModel)]="descripcion"
              name="descripcion"
              placeholder="Descripción del producto"
              rows="4"
            ></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="precio-input">
                Precio ($) <span class="required">*</span>
              </label>
              <input
                id="precio-input"
                type="number"
                class="form-input"
                [(ngModel)]="precio"
                name="precio"
                min="0"
                step="0.01"
                placeholder="0.00"
                required
              />
            </div>

            <div class="form-group">
              <label for="stock-input">
                Stock <span class="required">*</span>
              </label>
              <input
                id="stock-input"
                type="number"
                class="form-input"
                [(ngModel)]="stock"
                name="stock"
                min="0"
                step="1"
                placeholder="0"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="categoria-select">
              Categoría <span class="required">*</span>
            </label>
            <select
              id="categoria-select"
              class="form-input form-select"
              [(ngModel)]="categoriaId"
              name="categoriaId"
              required
            >
              <option value="0" disabled>Seleccione una categoría</option>
              <option *ngFor="let cat of categories" [value]="cat.id">
                {{ cat.nombre }}
              </option>
            </select>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" (click)="goBack()" id="cancel-btn">
              Cancelar
            </button>
            <button type="submit" class="btn-save" [disabled]="saving" id="save-btn">
              <span *ngIf="!saving">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                  <polyline points="17 21 17 13 7 13 7 21"/>
                  <polyline points="7 3 7 8 15 8"/>
                </svg>
                Guardar cambios
              </span>
              <span *ngIf="saving" class="spinner-wrap">
                <span class="spinner"></span>
                Guardando...
              </span>
            </button>
          </div>
        </form>
      </div>

    </div>
  </main>
</div>
